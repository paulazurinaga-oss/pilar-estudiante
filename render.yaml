services:
  - type: web
    name: pilar-del-estudiante
    runtime: node
    plan: starter
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: GEMINI_TRANSCRIPTION_MODEL
        value: gemini-3.6-flash
    disk:
      name: pilar-storage
      mountPath: /data/storage
      sizeGB: 10
